---
version: 2
updates:
  # deploy.yaml checks and builds only on a push to main, so a bump PR shows
  # no check of its own: it is first built when it is merged. A build that
  # fails there stops before the deploy job and the previous site stays up,
  # so run `npm run check && npm run build` on the branch before merging.
  # Astro majors stay out of the group, because they have changed config and
  # output format before.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # deploy.yaml pins withastro/action and the Pages actions by major.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
