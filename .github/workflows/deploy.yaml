---
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages publishes what this uploads; the build output is not in git. It once
# was, in docs/, because the token in use then could not write this file.

# The deploy job needs to write to Pages and to prove who it is with an OIDC
# token; nothing else here writes anything.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one halfway: a cancelled deploy can
# leave Pages serving nothing new while the next run is still queued.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          # The type check runs here too, so a page that does not check
          # never ships.
          build-cmd: npm run check && npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
